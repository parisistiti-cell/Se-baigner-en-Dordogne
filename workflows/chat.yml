name: Chat avec accord

# Lancement manuel : onglet Actions > "Chat avec accord" > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Appliquer l'accord avant chargement du chat
        run: python3 chat_accord.py --write
      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "Chat : information et accord avant chargement de Cbox"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
